{{- if .Values.secrets.createSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.secretKeyRef.name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ include "cert-manager-webhook-spaceship.name" . }}
    chart: {{ include "cert-manager-webhook-spaceship.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
type: Opaque
stringData:
  {{ .Values.secrets.secretKeyRef.apiKeyKey }}: {{ .Values.secrets.apiKey | quote }}
  {{ .Values.secrets.secretKeyRef.apiSecretKey }}: {{ .Values.secrets.apiSecret | quote }}
{{- end -}}
